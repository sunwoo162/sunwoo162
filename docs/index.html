<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Development Log · sunwoo162</title>
<style>
:root{color-scheme:dark;font-family:Inter,system-ui,sans-serif;background:#0b1017;color:#e9f0f7}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#1a483c55,transparent 65%),#0b1017}
main{max-width:870px;margin:0 auto;padding:42px 20px 90px}a{color:inherit;text-decoration:none}header,.heading{display:flex;align-items:center;justify-content:space-between;gap:15px}header{font-size:13px;color:#93b1bb}header strong{color:#70dbac;letter-spacing:.12em}
h1{font-size:clamp(33px,6vw,53px);letter-spacing:-.065em;line-height:1.1;margin:45px 0 16px}p{color:#92a6b7;line-height:1.7;font-size:14px;margin-bottom:32px}
section{background:#111b25;border:1px solid #2a3946;border-radius:20px;padding:25px;margin-bottom:18px}.overline{letter-spacing:.12em;text-transform:uppercase;font-size:11px;color:#8ba4b3;font-weight:680}.title{font-size:20px;font-weight:750;margin-top:6px}
.nav{display:flex;gap:7px}button{font:inherit;cursor:pointer}.nav button,.filters button{color:#dae4ea;background:#20303e;border:1px solid #344553;padding:9px 13px;border-radius:10px}.nav button:hover,.filters button:hover{background:#294736}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:7px;margin-top:25px}
.weekday{color:#92a5b4;text-align:center;padding:9px 2px;font-size:12px}.cell{height:78px;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;border:1px solid #304250;border-radius:11px;background:#172631;color:#ecf4f8;padding:11px;cursor:pointer}.cell small{font-size:11px;color:#acc2c8}.cell:hover{border-color:#66dbab}.cell.active{border:2px solid #68e1ac;background:#24483f}.cell.l1{background:#19362e}.cell.l2{background:#20523d}.cell.l3{background:#286d4f}.legend{font-size:11px;color:#92a4b0;margin-top:13px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:23px}.stat{background:#172732;border:1px solid #2c3e4b;padding:17px 12px;border-radius:12px}.stat strong{display:block;font-size:26px}.stat span{color:#8ba0b0;font-size:12px}
.filters{display:flex;flex-wrap:wrap;gap:7px;margin-top:21px}.filters button{font-size:12px}.filters button.active{background:#245340;border-color:#62cc98}
.record{display:flex;gap:13px;align-items:center;padding:17px 0;border-bottom:1px solid #2b3b47}.record:last-child{border-bottom:0}.record-icon{background:#253d40;color:#89e8b7;display:grid;place-items:center;width:40px;height:40px;border-radius:12px;flex-shrink:0}.record-main{flex:1;min-width:0}.record-title{font-size:14px;font-weight:700;overflow-wrap:anywhere}.record-title:hover{color:#71eab2}.meta{margin-top:5px;color:#8da5b5;font-size:12px;overflow-wrap:anywhere}.time{color:#8297a8;font-size:12px}.empty{padding:38px 8px;color:#90a6b5;text-align:center;font-size:13px}
footer{color:#8094a4;font-size:12px;line-height:1.8}footer a{text-decoration:underline}
@media(max-width:560px){main{padding:25px 12px 60px}section{padding:16px}.calendar{gap:4px}.cell{height:57px;padding:8px 6px}.cell small{font-size:10px}.stats{grid-template-columns:repeat(2,1fr)}.title{font-size:17px}}
</style></head><body><main>
<header><strong>● DEVELOPMENT LOG</strong><a href="https://github.com/sunwoo162">GitHub Profile ↗</a></header>
<h1>Every commit.<br>Every day.</h1><p>작업한 커밋, PR, Issue를 날짜별로 확인하고,<br>작업 제목을 눌러 실제 GitHub 기록으로 이동합니다.</p>
<section><div class="heading"><div><div class="overline">Activity Calendar · KST</div><div class="title" id="month"></div></div><div class="nav"><button id="prev" aria-label="이전 달">←</button><button id="today">오늘</button><button id="next" aria-label="다음 달">→</button></div></div>
<div class="calendar" id="calendar"></div><div class="legend">⬜ 활동 없음 · 🟩 적음 · 🟢 보통 · 💚 많음</div></section>
<section><div class="heading"><div><div class="overline">Selected Activity</div><div class="title" id="day"></div></div><span id="total" class="meta"></span></div><div class="stats" id="stats"></div><div class="filters" id="filters"></div><div id="timeline"></div></section>
<footer>GitHub Actions 자동 수집 · 한국시간(KST) · 공개 저장소만 포함 · 커미터 시각은 Push 시각과 다를 수 있음<br><a href="https://github.com/sunwoo162/sunwoo162">GitHub Repository</a></footer>
</main>
<script>
(function(){
const $=id=>document.getElementById(id), params=new URLSearchParams(location.search);
function kst(){const a=new Intl.DateTimeFormat("en-US",{timeZone:"Asia/Seoul",year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(new Date()),b={};a.forEach(x=>b[x.type]=x.value);return b.year+"-"+b.month+"-"+b.day}
const today=kst();let chosen=params.get("date");if(!/^\d{4}-\d{2}-\d{2}$/.test(chosen||"")||isNaN(Date.parse(chosen+"T00:00:00Z")))chosen=today;
let year=+chosen.slice(0,4),month=+chosen.slice(5,7)-1,filter="all",data={};
function elem(tag,cls,txt){let n=document.createElement(tag);if(cls)n.className=cls;if(txt!==undefined)n.textContent=txt;return n}
function key(i){return year+"-"+String(month+1).padStart(2,"0")+"-"+String(i).padStart(2,"0")}
function list(k){return data[k]||[]}
function calendar(){const box=$("calendar");box.replaceChildren();$("month").textContent=year+"년 "+(month+1)+"월";
["일","월","화","수","목","금","토"].forEach(x=>box.append(elem("span","weekday",x)));
const first=new Date(Date.UTC(year,month,1)).getUTCDay(),days=new Date(Date.UTC(year,month+1,0)).getUTCDate();
for(let i=0;i<first;i++)box.append(elem("span"));
for(let i=1;i<=days;i++){let date=key(i),n=list(date).length,level=n?Math.min(3,Math.ceil(n/4)):0,b=elem("button","cell l"+level+(date===chosen?" active":""));
b.setAttribute("aria-label",date+" 활동 "+n+"건");b.append(elem("strong","",i),elem("small","",n?n+"건":"·"));
b.onclick=()=>{chosen=date;filter="all";history.replaceState(null,"","?date="+date);render()};box.append(b)}}
function details(){const all=list(chosen);$("day").textContent=chosen+" 활동 기록";$("total").textContent=all.length+" activities";const s=$("stats");s.replaceChildren();
[[all.filter(x=>x.kind==="commit").length,"Commits"],[all.filter(x=>x.kind==="pr").length,"Pull Requests"],[all.filter(x=>x.kind==="issue").length,"Issues"],[new Set(all.map(x=>x.repo)).size,"Repositories"]].forEach(x=>{let b=elem("div","stat");b.append(elem("strong","",x[0]),elem("span","",x[1]));s.append(b)});
const fs=$("filters");fs.replaceChildren();[["all","전체"],["commit","Commits"],["pr","PRs"],["issue","Issues"]].forEach(x=>{let b=elem("button",filter===x[0]?"active":"",x[1]);b.onclick=()=>{filter=x[0];details()};fs.append(b)});
const timeline=$("timeline");timeline.replaceChildren();let matches=all.filter(x=>filter==="all"||x.kind===filter);
if(!matches.length){timeline.append(elem("div","empty","이 날짜에 해당하는 공개 활동이 없습니다."));return}
matches.forEach(x=>{let row=elem("article","record"),icon=elem("span","record-icon",x.kind==="commit"?"●":x.kind==="pr"?"⑂":"◇"),m=elem("div","record-main"),a=elem("a","record-title",x.title);
a.href=x.url;a.target="_blank";a.rel="noopener noreferrer";m.append(a,elem("div","meta",x.repo+" · "+x.kind.toUpperCase()));row.append(icon,m,elem("span","time",x.time));timeline.append(row)})}
function render(){calendar();details()}
function move(step){const date=new Date(Date.UTC(year,month+step,1));year=date.getUTCFullYear();month=date.getUTCMonth();calendar()}
$("prev").onclick=()=>move(-1);$("next").onclick=()=>move(1);$("today").onclick=()=>{chosen=today;year=+today.slice(0,4);month=+today.slice(5,7)-1;filter="all";history.replaceState(null,"","?date="+today);render()};
render();fetch("./activity.json",{cache:"no-store"}).then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(j=>{data=j.days||{};render()}).catch(()=>{$("timeline").replaceChildren(elem("div","empty","데이터를 불러오지 못했습니다."))})
})();
</script></body></html>

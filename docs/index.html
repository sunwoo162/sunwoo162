<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0d1117">
<title>Activity · sunwoo162</title>
<style>
:root{color-scheme:dark;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0d1117;color:#e6edf3}
*{box-sizing:border-box}
body{margin:0;background:#0d1117}
a{color:inherit;text-decoration:none}
button,input{font:inherit}
button{cursor:pointer}
.shell{max-width:950px;margin:0 auto;padding:35px 22px 85px}
.top,.head,.filters{display:flex;align-items:center;justify-content:space-between;gap:14px}
.top{color:#8b949e;font-size:13px;margin-bottom:25px}
.top strong{color:#c9d1d9;font-size:14px}
.top a:hover,.worktitle:hover{color:#58a6ff}
.panel{border:1px solid #30363d;border-radius:12px;padding:24px;background:#0d1117}
h1{font-size:20px;font-weight:650;margin:0}
.head{margin-bottom:20px;flex-wrap:wrap}
.date-nav{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.date-nav button,.date-nav input{background:#21262d;border:1px solid #30363d;border-radius:7px;padding:8px 11px;color:#c9d1d9;font-size:13px}
.date-nav button:hover{background:#30363d}
.date-nav button:disabled{opacity:.42;cursor:default}
.date-nav input{color-scheme:dark}
.date-nav :focus-visible,.filters :focus-visible{outline:2px solid #58a6ff;outline-offset:2px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stat{border:1px solid #30363d;background:#161b22;padding:15px;border-radius:9px}
.stat strong{font-size:24px;display:block}
.stat small{font-size:12px;color:#8b949e;display:block;margin-top:4px}
.note{font-size:12px;color:#8b949e}
.filters{justify-content:flex-start;flex-wrap:wrap;gap:8px;margin-top:22px}
.filters button{background:transparent;border:1px solid #30363d;border-radius:7px;padding:8px 13px;color:#8b949e;font-size:12px}
.filters button.active{background:#21262d;color:#e6edf3;border-color:#47525e}
.timeline{margin-top:10px}
.entry{display:flex;align-items:center;gap:12px;padding:16px 3px;border-bottom:1px solid #21262d}
.entry:last-child{border-bottom:0}
.entry-icon{display:flex;justify-content:center;align-items:center;width:34px;height:34px;flex-shrink:0;border:1px solid #30363d;border-radius:8px;color:#3fb950}
.entry-body{flex:1;min-width:0}
.worktitle{font-size:14px;font-weight:600;line-height:1.5;overflow-wrap:anywhere}
.meta{color:#8b949e;font-size:12px;margin-top:4px;overflow-wrap:anywhere}
.entry-time{color:#8b949e;font-size:12px;flex-shrink:0}
.empty{padding:38px 12px;text-align:center;color:#8b949e;font-size:13px}
@media(max-width:600px){.shell{padding:18px 12px 60px}.panel{padding:16px}.stats{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<main class="shell">
<header class="top"><strong>sunwoo162 / Activity</strong><a href="https://github.com/sunwoo162">GitHub ↗</a></header>
<section class="panel">
<div class="head">
  <h1>Activity</h1>
  <div class="date-nav" aria-label="날짜 선택">
    <button id="prev" aria-label="전날">←</button>
    <input id="date" type="date" aria-label="조회 날짜">
    <button id="next" aria-label="다음 날">→</button>
    <button id="today">Today</button>
  </div>
</div>
<div class="head"><span class="note" id="selected"></span><span class="note" id="total"></span></div>
<div id="stats" class="stats"></div>
<div id="filters" class="filters"></div>
<div id="timeline" class="timeline"></div>
</section>
</main>
<script>
(()=>{
"use strict";
const $=id=>document.getElementById(id),params=new URLSearchParams(location.search);
function todayKST(){
 const data={};
 new Intl.DateTimeFormat("en-US",{timeZone:"Asia/Seoul",year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(new Date()).forEach(x=>data[x.type]=x.value);
 return data.year+"-"+data.month+"-"+data.day;
}
const today=todayKST();
let date=params.get("date");
if(!/^\d{4}-\d{2}-\d{2}$/.test(date||"")||Number.isNaN(Date.parse(date+"T00:00:00Z")))date=today;
let filter="all",data={};
const elem=(tag,className,text)=>{const e=document.createElement(tag);if(className)e.className=className;if(text!==undefined)e.textContent=text;return e};
const entries=()=>data[date]||[];
function move(days){
 const d=new Date(date+"T00:00:00Z");d.setUTCDate(d.getUTCDate()+days);
 choose(d.toISOString().slice(0,10));
}
function choose(next){
 if(!/^\d{4}-\d{2}-\d{2}$/.test(next)||Number.isNaN(Date.parse(next+"T00:00:00Z")))return;
 date=next;filter="all";
 history.replaceState(null,"","?date="+encodeURIComponent(date));
 render();
}
function render(){
 $("date").value=date;
 $("date").max=today;
 $("next").disabled=date>=today;
 $("selected").textContent=date;
 const items=entries();$("total").textContent=items.length+" activities";
 const statValues=[
  [items.filter(x=>x.kind==="commit").length,"Commits"],
  [items.filter(x=>x.kind==="pr").length,"Pull Requests"],
  [items.filter(x=>x.kind==="issue").length,"Issues"],
  [new Set(items.map(x=>x.repo)).size,"Repositories"]
 ];
 const stats=$("stats");stats.replaceChildren();
 statValues.forEach(([value,label])=>{
  const block=elem("div","stat");block.append(elem("strong","",String(value)),elem("small","",label));stats.append(block);
 });
 const bar=$("filters");bar.replaceChildren();
 [["all","All"],["commit","Commits"],["pr","Pull Requests"],["issue","Issues"]].forEach(([id,label])=>{
  const button=elem("button",filter===id?"active":"",label);
  button.setAttribute("aria-pressed",filter===id?"true":"false");
  button.onclick=()=>{filter=id;render()};
  bar.append(button);
 });
 const timeline=$("timeline");timeline.replaceChildren();
 const filtered=items.filter(x=>filter==="all"||x.kind===filter);
 if(!filtered.length){timeline.append(elem("div","empty","이 날짜에 표시할 활동이 없습니다."));return}
 filtered.forEach(item=>{
  const row=elem("div","entry");
  const symbol=elem("span","entry-icon",item.kind==="pr"?"⑂":item.kind==="issue"?"◇":"●");
  const body=elem("div","entry-body");
  const link=elem("a","worktitle",item.title);
  link.href=item.url;link.rel="noopener noreferrer";link.target="_blank";
  body.append(link,elem("div","meta",item.repo+" · "+item.kind.toUpperCase()));
  row.append(symbol,body,elem("span","entry-time",item.time));
  timeline.append(row);
 });
}
$("prev").onclick=()=>move(-1);
$("next").onclick=()=>{if(date<today)move(1)};
$("today").onclick=()=>choose(today);
$("date").onchange=()=>choose($("date").value);
render();
fetch("./activity.json",{cache:"no-store"})
 .then(r=>{if(!r.ok)throw Error("Data unavailable");return r.json()})
 .then(result=>{data=result.days||{};render()})
 .catch(e=>{$("timeline").replaceChildren(elem("div","empty",e.message))});
})();
</script>
</body>
</html>
